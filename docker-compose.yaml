services:
  # Single-container service. Database memakai SQLite (file-based) sehingga
  # TIDAK ada container DB terpisah — service selalu bisa start tanpa
  # bergantung pada healthcheck/startup MySQL (penyebab "db ... is unhealthy").
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=sqlite
