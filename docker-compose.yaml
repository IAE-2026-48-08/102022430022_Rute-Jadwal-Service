services:
  # PHP Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=102022430022_rute_jadwal_service
      - DB_USERNAME=root
      - DB_PASSWORD=rootpassword
      - IAE_API_KEY=${IAE_API_KEY}
      - IAE_TEAM_ID=${IAE_TEAM_ID}
      - IAE_NIM=${IAE_NIM}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rute-jadwal-network

  # MySQL Database Service
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --skip-name-resolve
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=102022430022_rute_jadwal_service
      - MYSQL_ROOT_PASSWORD=rootpassword
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword" ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - rute-jadwal-network

networks:
  rute-jadwal-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
